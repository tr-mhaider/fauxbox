name: CI

on:
  push:
    branches: [develop, feature/multi-tenancy]
  pull_request:

jobs:
  api:
    name: Go API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fauxbox
          POSTGRES_PASSWORD: fauxbox
          POSTGRES_DB: fauxbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fauxbox -d fauxbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests read MP_DATABASE; the app also accepts DATABASE_URL.
      MP_DATABASE: postgres://fauxbox:fauxbox@localhost:5432/fauxbox?sslmode=disable
      DATABASE_URL: postgres://fauxbox:fauxbox@localhost:5432/fauxbox?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # -p 1 runs packages serially: they share one PostgreSQL database and
      # bind fixed SMTP/HTTP ports, so parallel packages would collide.
      - name: Test
        run: go test -p 1 ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
