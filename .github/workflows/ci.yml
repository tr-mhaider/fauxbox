name: CI

on:
  push:
    branches: [develop, feature/multi-tenancy]
  pull_request:

jobs:
  api:
    name: Go API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fauxbox
          POSTGRES_PASSWORD: fauxbox
          POSTGRES_DB: fauxbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fauxbox -d fauxbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Wired now so the Phase 1 Postgres port needs no CI change.
      DATABASE_URL: postgres://fauxbox:fauxbox@localhost:5432/fauxbox?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
